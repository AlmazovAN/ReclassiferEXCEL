name: Publish release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the release package without publishing, or publish after validation.
        type: choice
        options:
          - validate
          - publish
        default: validate
        required: true

permissions:
  actions: read
  contents: write

concurrency:
  group: reclassifier-release-main
  cancel-in-progress: false

jobs:
  release:
    if: (inputs.mode == 'validate' || inputs.mode == 'publish') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful full acceptance for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          successful="$(gh run list \
            --workflow build.yml \
            --branch main \
            --commit "$GITHUB_SHA" \
            --limit 50 \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length')"
          if [[ "$successful" == "0" ]]; then
            echo "No successful full acceptance run exists for $GITHUB_SHA."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          base = Path("VERSION").read_text(encoding="utf-8").strip()
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", base)
          if not match:
              raise SystemExit(f"Invalid VERSION: {base!r}")
          major, minor, base_patch = map(int, match.groups())
          prefix = f"v{major}.{minor}."
          tags = subprocess.check_output(
              ["git", "tag", "--list", f"{prefix}*"], text=True
          ).splitlines()
          patches = []
          for tag in tags:
              tag_match = re.fullmatch(rf"{re.escape(prefix)}(\d+)", tag.strip())
              if tag_match:
                  patches.append(int(tag_match.group(1)))
          release = f"{major}.{minor}.{max(patches) + 1}" if patches else f"{major}.{minor}.{base_patch}"
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"RECLASSIFIER_VERSION={release}\n")
          print(f"Release version: {release}")
          PY

      - name: Build and validate data-free CORE HTML
        shell: bash
        run: |
          set -euo pipefail
          python build/build.py
          python tests/check_core_html.py

      - name: Create version tag
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RECLASSIFIER_VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            tagged_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Existing tag $tag points to $tagged_commit, not $GITHUB_SHA."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Reclassifier ${RECLASSIFIER_VERSION}"
            git push origin "$tag"
          fi

      - name: Publish release HTML
        id: publish
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RECLASSIFIER_VERSION}"
          core="dist/Reclassifier_v${RECLASSIFIER_VERSION}_CORE.html"
          files=("$core")
          notes="Standalone offline CORE HTML; connect an existing Reclassifier.db."
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${files[@]}" \
              --verify-tag \
              --repo "$GITHUB_REPOSITORY" \
              --title "Reclassifier ${RECLASSIFIER_VERSION}" \
              --notes "$notes"
          fi

      - name: Write release validation summary
        if: always()
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_STATUS: ${{ job.status }}
          RELEASE_SHA: ${{ github.sha }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ.get("RECLASSIFIER_VERSION", "not resolved")
          core = Path(f"dist/Reclassifier_v{version}_CORE.html")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as out:
              out.write("## Release pipeline\n\n")
              out.write(f"- Mode: `{os.environ.get('RELEASE_MODE')}`\n")
              out.write(f"- Validation job: **{os.environ.get('RELEASE_STATUS')}**\n")
              out.write(f"- Commit: `{os.environ.get('RELEASE_SHA')}`\n")
              out.write(f"- CORE package: {'ready (' + format(core.stat().st_size, ',') + ' bytes)' if core.is_file() else 'not produced'}\n")
              outcome = os.environ.get("PUBLISH_OUTCOME")
              mode = os.environ.get("RELEASE_MODE")
              label = "not requested" if mode == "validate" else "published" if outcome == "success" else "not attempted" if outcome == "skipped" else "not completed"
              out.write(f"- Publication: {label}\n")
          PY
